name: expense_tracker
description: Expense tracker app with SMS parsing and analytics.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  # Community fork: AGP namespaces + Android 16KB page-size aligned native libs
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.5
  uuid: ^4.5.1
  intl: ^0.20.2
  fl_chart: ^0.69.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.3
  workmanager: ^0.9.0+3
  another_telephony: ^0.4.1
  shared_preferences: ^2.3.2
  image_picker: ^1.2.2
  share_plus: ^10.1.4
  file_picker: ^8.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  isar_community_generator: ^3.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/illustrations/
    - assets/images/
