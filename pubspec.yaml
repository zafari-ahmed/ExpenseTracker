name: expense_tracker
description: Expense tracker app with SMS parsing and analytics.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  uuid: ^4.5.1
  intl: ^0.20.2
  dio: ^5.9.0
  fl_chart: ^0.69.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.3
  workmanager: ^0.9.0+3
  another_telephony: ^0.4.1
  shared_preferences: ^2.3.2
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1

dependency_overrides:
  # Official isar_flutter_libs lacks AGP 8+ namespace; use local patched copy.
  isar_flutter_libs:
    path: packages/isar_flutter_libs

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/illustrations/
    - assets/images/
